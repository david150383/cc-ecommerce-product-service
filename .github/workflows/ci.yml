name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: product_svc
          POSTGRES_PASSWORD: product_local_pw
          POSTGRES_DB: product_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U product_svc -d product_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://product_svc:product_local_pw@localhost:5432/product_db
      TEST_DATABASE_URL: postgresql+psycopg://product_svc:product_local_pw@localhost:5432/product_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: No known vulnerabilities in the pinned runtime dependencies (pip-audit)
        run: pipx run pip-audit==2.10.0 -r requirements.txt --disable-pip --no-deps --progress-spinner off
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations round-trip (upgrade, downgrade to empty, upgrade)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Models and migrations have not drifted
        run: alembic check
      - name: Unit + integration tests (warnings are errors)
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and migrate images (not pushed until Phase 7)
        run: |
          docker buildx build --target runtime -t ecommerce-product-service:${{ github.sha }} --load .
          docker buildx build --target migrate -t ecommerce-product-service-migrate:${{ github.sha }} --load .
