[project]
name = "ecommerce-product-service"
version = "0.1.0"
description = "Catalog, categories, variants and pricing for the e-commerce platform."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "structlog>=25.4",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "pyjwt[crypto]>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx2>=2.13",
  "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error",
  # Known Alembic limitation, documented on Product.search_vector in app/models.py.
  "ignore:Computed default on products.search_vector cannot be modified:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S104"]  # binding 0.0.0.0 is intended inside the container

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
